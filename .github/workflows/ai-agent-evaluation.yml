name: AI Agent Evaluation

on:
  push:
    branches:
      - feature/persistence-build-001
  pull_request:
    branches:
      - feature/persistence-build-001

jobs:
  ai-agent-evaluation:
    name: AI Agent Evaluation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_ordering_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d food_ordering_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      PORT: "8000"
      MENU_BACKEND_URL: "http://localhost:8001"
      GOOGLE_API_KEY: "ci-test-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/food_ordering_ci"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/food_ordering_ci"
      TEST_DATABASE_NAME: "food_ordering_ci"
      TEST_DATABASE_CONFIRMATION: "I_ACKNOWLEDGE_TEST_DATABASE:food_ordering_ci"
      JWT_SECRET_KEY: "ci-test-jwt-secret-key-minimum-32-characters"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv sync --frozen --dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Compile backend
        run: uv run python -m compileall src -q

      - name: Run AI evaluation framework
        run: uv run pytest tests/test_evaluation_framework.py tests/test_evaluation_thresholds.py -q

      - name: Run AI evaluation report
        run: uv run python -m src.evaluation

      - name: Run backend regression
        run: uv run pytest -q
