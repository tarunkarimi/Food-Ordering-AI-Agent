name: Full Stack CI

on:
  push:
    branches:
      - main
      - master
      - feature/persistence-build-001
  pull_request:
    branches:
      - main
      - master
      - feature/persistence-build-001

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_ordering_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d food_ordering_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: "8000"
      MENU_BACKEND_URL: "http://localhost:8001"
      GOOGLE_API_KEY: "ci-test-key"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/food_ordering_ci"
      JWT_SECRET_KEY: "ci-test-jwt-secret-key-minimum-32-characters"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Compile backend
        run: uv run python -m compileall src -q

      - name: Run AI memory tests
        run: uv run pytest tests/test_ai_memory.py -q

      - name: Run observability tests
        run: uv run pytest tests/test_agent_observability.py -q

      - name: Run auth authorization tests
        run: uv run pytest tests/test_auth_authorization.py -q

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  menu-backend:
    name: Menu Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: menu-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile menu backend
        run: python -m compileall main.py -q

  docker:
    name: Docker Builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - menu-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AI backend image
        run: docker build -f backend/Dockerfile -t food-ordering-ai-backend:ci .

      - name: Build menu backend image
        run: docker build -f menu-backend/Dockerfile -t food-ordering-menu-backend:ci .
