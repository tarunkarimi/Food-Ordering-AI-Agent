[project]
name = "backend"
version = "0.1.0"
description = "Backend for chatbot agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain[google-genai]>=0.3.26",
    "langchain-community>=0.3.26",
    "python-dotenv>=1.1.1",
    "langgraph>=0.5.0",
    "duckduckgo-search>=8.0.5",
    "supabase>=2.16.0",
    "graphviz>=0.21",
    "boto3>=1.39.3",
    "fastapi>=0.115.14",
    "uvicorn>=0.35.0",
    "langchain-google-genai>=4.3.4",
    "langchain-core>=1.5.5",
    "google-genai>=2.18.1",
    "sqlalchemy>=2.0.36,<3.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "phonenumbers>=9.0.0,<10.0.0",
    "PyJWT>=2.10.1,<3.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]