services:
  menu-backend:
    build:
      context: .
      dockerfile: menu-backend/Dockerfile
    container_name: food-ordering-menu-backend
    environment:
      PORT: 8000
      FRONTEND_ORIGINS: http://localhost:5173
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: food-ordering-ai-backend
    environment:
      PORT: 8000
      MENU_BACKEND_URL: http://menu-backend:8000
      FRONTEND_ORIGINS: http://localhost:5173
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-8}
      DOWNSTREAM_REQUEST_TIMEOUT_SECONDS: ${DOWNSTREAM_REQUEST_TIMEOUT_SECONDS:-10}
      DOWNSTREAM_READ_RETRIES: ${DOWNSTREAM_READ_RETRIES:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
    ports:
      - "8000:8000"
    depends_on:
      menu-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
