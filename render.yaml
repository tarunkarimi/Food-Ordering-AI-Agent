services:
  - type: web
    runtime: python
    name: food-ordering-ai-backend
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: uv sync --frozen --no-dev --no-install-project
    startCommand: uv run --no-sync uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: MENU_BACKEND_URL
        fromService:
          type: web
          name: food-ordering-menu-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: MENU_SERVICE_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: food-ordering-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: python
    name: food-ordering-menu-backend
    rootDir: menu-backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: MENU_DATABASE_URL
        sync: false
      - key: MENU_MIGRATION_DATABASE_URL
        sync: false
      - key: MENU_SERVICE_API_KEY
        sync: false

  - type: web
    runtime: static
    name: food-ordering-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_AI_API_URL
        fromService:
          type: web
          name: food-ordering-ai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_MENU_API_URL
        fromService:
          type: web
          name: food-ordering-menu-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
